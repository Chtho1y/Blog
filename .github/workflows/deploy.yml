name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches:
      - main  # 触发条件为 main 分支的更改

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: 检出代码
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          submodules: true 

      # Step 2: 安装 Hugo
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.125.7'

      # Step 3: 构建 Hugo 静态页面
      - name: Build Hugo site
        run: cd blog&&hugo --cleanDestinationDir --baseURL "https://www.aiqwq.com/"

      # Step 4: 部署到 GitHub Pages 的 gh-pages 分支
      # - name: Deploy to GitHub Pages
      #   uses: peaceiris/actions-gh-pages@v3
      #   with:
      #     github_token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      #     publish_dir: ./blog/public
      #     publish_branch: gh-pages
      #     keep_files: true

      # Step 4: 手动合并构建后的内容到 gh-pages 分支
      - name: Deploy to GitHub Pages
        run: |
          git clone --branch gh-pages https://github.com/Chtho1y/Blog.git gh-pages
          rsync -av --exclude='.git' ./blog/public/ ./gh-pages/
          cd gh-pages
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Incremental update for GitHub Pages"
          git push origin gh-pages