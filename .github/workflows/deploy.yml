name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches:
      - main  # 当 main 分支有更改时触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: 检出代码并更新子模块
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          submodules: true  # 确保更新子模块

      # Step 2: 安装 Hugo
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: 'latest'

      # Step 3: 构建 Hugo 静态页面
      - name: Build Hugo site
        run: hugo --source ./blog --destination ./public -D --cleanDestinationDir --baseURL https://www.aiqwq.com/

      # Step 4: 部署到 GitHub Pages 的 gh-pages 分支
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true  # 每次清空旧文件
