name: ProductHunt Update

on:
  schedule:
    - cron: '0 16 * * *' # 每天下午4点触发运行
  workflow_dispatch:

jobs:
  update-blog:
    runs-on: ubuntu-latest

    steps:
    # Step 1: 检出博客仓库代码
    - name: Checkout Blog Repository
      uses: actions/checkout@v3
      with:
        ref: main

    # Step 2: 下载并修改 Markdown 文件
    - name: Download Daily Markdown
      run: |
        TODAY=$(date '+%Y-%m-%d')
        NOW=$(date '+%Y-%m-%dT16:00:00+08:00')
        MARKDOWN_URL="https://raw.githubusercontent.com/ViggoZ/producthunt-daily-hot/refs/heads/main/data/producthunt-daily-${TODAY}.md"
        
        mkdir -p ./blog/content/zh/posts/
        curl -o ./blog/content/zh/posts/producthunt-daily-${TODAY}.md $MARKDOWN_URL
        
        echo "+++" > temp.md
        echo "date = '${NOW}'" >> temp.md
        echo "draft = false" >> temp.md
        echo "title = '[每日更新] ProductHunt热榜产品Top30 | ${TODAY}'" >> temp.md
        echo "+++" >> temp.md
        echo "" >> temp.md
        tail -n +2 ./blog/content/zh/posts/producthunt-daily-${TODAY}.md >> temp.md
        mv temp.md ./blog/content/zh/posts/producthunt-daily-${TODAY}.md

    # Step 3: 将 Markdown 文件部署到 main 分支
    - name: Prepare Temporary Directory
      run: |
        TODAY=$(date '+%Y-%m-%d')
        mkdir -p temp-content/blog/content/zh/posts
        cp ./blog/content/zh/posts/producthunt-daily-${TODAY}.md temp-content/

    - name: Deploy to Main Branch
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        publish_dir: temp-content
        publish_branch: main
        destination_dir: blog/content/zh/posts
        keep_files: true

    # Step 4: 安装 Hugo
    - name: Setup Hugo
      uses: peaceiris/actions-hugo@v2
      with:
        hugo-version: '0.125.7'

    # Step 5: 构建 Hugo 静态页面
    - name: Build Hugo site
      run: cd blog && hugo --cleanDestinationDir --baseURL "https://www.aiqwq.com/"

    # Step 6: 部署到 GitHub Pages
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        publish_dir: ./blog/public
        publish_branch: gh-pages
        keep_files: true
