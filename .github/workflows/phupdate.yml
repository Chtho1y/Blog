name: ProductHunt Update

on:
  schedule:
    - cron: '0 16 * * *' # 每天下午4点触发运行
  workflow_dispatch: # 支持手动触发

jobs:
  update-blog:
    runs-on: ubuntu-latest

    steps:
    # Step 1: 检出博客仓库代码
    - name: Checkout Blog Repository
      uses: actions/checkout@v3

    # Step 2: 下载并修改 Markdown 文件
    - name: Download Daily Markdown
      run: |
        TODAY=$(date '+%Y-%m-%d')
        NOW=$(date '+%Y-%m-%dT16:00:00+08:00')
        MARKDOWN_URL="https://raw.githubusercontent.com/ViggoZ/producthunt-daily-hot/refs/heads/main/data/producthunt-daily-${TODAY}.md"
        
        mkdir -p ./blog/content/zh/posts/
        curl -o ./blog/content/zh/posts/producthunt-daily-${TODAY}.md $MARKDOWN_URL
        
        echo "+++" > temp.md
        echo "date = '${NOW}'" >> temp.md
        echo "draft = false" >> temp.md
        echo "title = 'PH今日热榜 | ${TODAY}'" >> temp.md
        echo "+++" >> temp.md
        echo "" >> temp.md
        cat ./blog/content/zh/posts/producthunt-daily-${TODAY}.md >> temp.md
        mv temp.md ./blog/content/zh/posts/producthunt-daily-${TODAY}.md

    # Step 2: 安装 Hugo
    - name: Setup Hugo
      uses: peaceiris/actions-hugo@v2
      with:
        hugo-version: '0.125.7'

    # Step 3: 构建 Hugo 静态页面
    - name: Build Hugo site
      run: cd blog&&hugo --cleanDestinationDir --baseURL "https://www.aiqwq.com/"

    # Step 4: 部署到 GitHub Pages 的 gh-pages 分支
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        publish_dir: ./blog/public
        publish_branch: gh-pages
        keep_files: true
