{{ if and .IsHome (ne .Site.Params.broadcast "") }}
<style>
    .site-description {
        text-align: center;
        padding: 10px;
        margin-bottom: 20px;
        border-radius: 5px;
        font-style: italic;
        transition: background-color 0.3s, color 0.3s;
        font-size: 18px;
    }

    body:not(.dark) .site-description {
        background-color: #f0f0f0;
        color: #333;
    }

    body.dark .site-description {
        background-color: #3b3b3b;
        color: #d9d9d9;
    }

    @media (max-width: 768px) {
        .site-description {
            font-size: 16px;
        }
    }

    @media (max-width: 480px) {
        .site-description {
            font-size: 14px;
        }
    }
</style>
<div class="site-description">
    {{ .Site.Params.broadcast }}
</div>
{{ end }}
