baseURL = "https://www.aiqwq.com/"
title = '望乔随笔'
theme = "PaperMod"

# 语言设置
defaultContentLanguage = "zh"
defaultContentLanguageInSubdir = true

# 分页配置
paginate = 5
paginatePath = "page"

[languages]
  [languages.zh]
    languageName = "中文"
    languageCode = "zh-CN"
    contentDir = "content/zh"
    weight = 1
    title = "望乔随笔"

    [[languages.zh.menu.main]]
      identifier = "Anthropic"
      name = "Anthropic"
      url = "https://claude.ai/"
      weight = 10
    [[languages.zh.menu.main]]
      identifier = "OpenAI"
      name = "OpenAI"
      url = "https://chat.openai.com/"
      weight = 20
    [[languages.zh.menu.main]]
      identifier = "support"
      name = "赞助"
      url = "/zh/support/"
      weight = 30
    [[languages.zh.menu.main]]
      identifier = "search"
      name = ""
      pre = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -0.2em;"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>'
      url = "/zh/search/"
      weight = 40
    [languages.zh.params]
      homeInfoParams = { Title = "每一份思考，都是对未来的投资。", Content = """
<div style='display: flex; align-items: center; justify-content: space-between;'>
  <div style='flex: 1; padding-right: 1.5rem;'>
    <p>期待与志同道合的你碰撞思维火花，共创未来可能。</p>
    <br>
    <p>联系方式：</p>
      <ul>
        <li><b>微信: </b>Chtho1y</li>
        <li><b>邮箱: </b><a href="mailto:love.code@163.com">love.code@163.com</a></li>
      </ul>
  </div>
  <div style='flex: 0 0 150px; text-align: center;'>
    <img src="https://pic.imgdb.cn/item/6735b94bd29ded1a8c7625a2.png" alt="Profile Image" style="border-radius: 50%; max-width: 100%;">
  </div>
</div>
""" }
        broadcast = "捕捉变化中的机遇，凝聚洞见与价值。这里沉淀我的深度思考与实践中的高价值内容。"

  [languages.en]
    languageName = "English"
    languageCode = "en-US"
    contentDir = "content/en"
    weight = 2
    title = "Chtho1y's Blog"

    [[languages.en.menu.main]]
      identifier = "Anthropic"
      name = "Anthropic"
      url = "https://claude.ai/"
      weight = 10
    [[languages.en.menu.main]]
      identifier = "OpenAI"
      name = "OpenAI"
      url = "https://chat.openai.com/"
      weight = 20
    [[languages.en.menu.main]]
      identifier = "support"
      name = "Support"
      url = "/en/support/"
      weight = 30
    [[languages.en.menu.main]]
      identifier = "search"
      name = ""
      pre = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -0.2em;"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>'
      url = "/en/search/"
      weight = 40
    [languages.en.params]
      homeInfoParams = { Title = "Every thought is an investment in the future.", Content = """
<div style='display: flex; align-items: center; justify-content: space-between;'>
  <div style='flex: 1; padding-right: 1.5rem;'>
    <p>Eager to connect with like-minded innovators and co-create future possibilities.</p>
    <br>
    <p>Contact me:</p>
    <ul>
      <li><b>Email: </b><a href="mailto:love.code@163.com">love.code@163.com</a></li>
    </ul>
  </div>
  <div style='flex: 0 0 150px; text-align: center;'>
    <img src="https://pic.imgdb.cn/item/6735b94bd29ded1a8c7625a2.png" alt="Profile Image" style="border-radius: 50%; max-width: 100%;">
  </div>
</div>
"""}
        broadcast = "Seizing opportunities in the midst of change, distilling insights into value. This is where my deep reflections and high-impact learnings from practice converge."


[params]
  defaultTheme = "auto"
  ShowReadingTime = false
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowRssButtonInSectionTermList = true
  ShowLanguageSelector = true
  ShowToc = true

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 100
    threshold = 0.2
    minMatchCharLength = 1
    keys = ["title", "summary", "content"]

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/Chtho1y"

  [[params.socialIcons]]
    name = "twitter"
    url = "https://x.com/agi_engage"


[markup]
  [markup.highlight]
    noClasses = false
  [markup.goldmark.renderer]
    unsafe = true

[privacy]
  [privacy.vimeo]
    disabled = false
    simple = true
  [privacy.twitter]
    disabled = false
    enableDNT = true
    simple = true
  [privacy.instagram]
    disabled = false
    simple = true
  [privacy.youtube]
    disabled = false
    privacyEnhanced = true

[services]
  [services.instagram]
    disableInlineCSS = true
  [services.twitter]
    disableInlineCSS = true
    
[outputs]
  home = ["HTML", "RSS", "JSON"]
